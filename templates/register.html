{% extends "base.html" %}
{% block title %}Open Account{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:auto">
  <h1>Open an Account</h1>
  <form method="post">
    <label>Full name</label><input name="name" value="{{ form.get('name', '') }}" required>
    <label>Phone (10 digits)</label><input name="phone" value="{{ form.get('phone', '') }}" inputmode="numeric" maxlength="10" required>
    <label>Email</label><input name="email" type="email" value="{{ form.get('email', '') }}" required>
    <label>KYC document</label>
    <select name="id_type">{% for t in id_types %}<option {{ 'selected' if form.get('id_type') == t }}>{{ t }}</option>{% endfor %}</select>
    <label>KYC document number</label><input name="id_number" value="{{ form.get('id_number', '') }}" required>
    <label>Account type</label>
    <select name="account_type">
      {% for t, m in min_balance.items() %}<option value="{{ t }}" {{ 'selected' if form.get('account_type') == t }}>{{ t.title() }} (minimum balance {{ m|inr }})</option>{% endfor %}
    </select>
    <label>Opening deposit (₹)</label><input name="opening_amount" type="number" step="0.01" min="0" value="{{ form.get('opening_amount', '') }}" required>
    <label>Set 4-digit PIN</label><input name="pin" type="password" inputmode="numeric" maxlength="4" required>
    <label>Confirm PIN</label><input name="confirm_pin" type="password" inputmode="numeric" maxlength="4" required>
    <button type="submit">Create Account</button>
  </form>
</div>
{% endblock %}
